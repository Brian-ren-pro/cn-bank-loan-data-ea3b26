<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>中国银行贷款数据</title>
<meta name="robots" content="noindex,nofollow,noarchive">
<style>
:root{color-scheme:dark;--bg:#070c14;--ink:#e9eef7;--muted:#a7b9cd;--dim:#7d90a8;--line:rgba(255,255,255,.17);--line2:rgba(255,255,255,.09);--panel:rgba(255,255,255,.085);--panel2:rgba(255,255,255,.055);--gold:#d8b26a;--blue:#8ec3ea;--green:#8fd3a8;--red:#e59a8f;--paper:#f6f2e7;--paper-ink:#1b1b1b}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:radial-gradient(1100px 620px at 78% -12%,rgba(106,169,216,.22),transparent 62%),radial-gradient(900px 520px at 8% 108%,rgba(216,178,106,.16),transparent 60%),linear-gradient(180deg,#0b1320 0%,#101b2b 55%,#0b1320 100%);background-attachment:fixed;color:var(--ink);font-family:"PingFang SC","Noto Sans CJK SC","Microsoft YaHei",system-ui,sans-serif;-webkit-font-smoothing:antialiased;min-height:100%}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;background-image:linear-gradient(rgba(255,255,255,.028) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.028) 1px,transparent 1px);background-size:64px 64px;mask-image:radial-gradient(ellipse at 50% 30%,#000 30%,transparent 78%)}
.wrap{position:relative;z-index:1;max-width:1280px;margin:0 auto;padding-block:26px 80px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.topband{position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:#0b1320}
.topbar{display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line2);padding-bottom:14px;margin-bottom:22px;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:14px}
.brand .mark{width:9px;height:9px;border:1px solid var(--gold);transform:rotate(45deg);display:inline-block}
.brand h1{font-family:"Songti SC",Georgia,serif;font-size:19px;letter-spacing:.22em;font-weight:600}
.brand small{color:var(--dim);font-size:11px;letter-spacing:.18em}
.topnav{display:flex;gap:8px;flex-wrap:wrap}
.back{color:var(--muted);text-decoration:none;font-size:12.5px;letter-spacing:.08em;border:1px solid var(--line);padding:7px 14px;border-radius:2px;transition:.25s}
.back:hover,.back.on{color:var(--ink);border-color:var(--gold);background:rgba(216,178,106,.08)}
.hero{padding:10px 0 4px;text-align:center}
.hero .kicker{color:var(--gold);letter-spacing:.42em;font-size:11px;margin-bottom:18px}
.hero h2{font-family:"Songti SC",Georgia,serif;font-size:46px;font-weight:600;letter-spacing:.1em;background:linear-gradient(180deg,#fff 20%,#b9c9dc 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{margin-top:16px;color:#adc0d4;font-size:13.5px;letter-spacing:.06em;line-height:1.9}
.rootnode{margin:30px auto 0;max-width:520px;text-align:center;border:1px solid var(--line);background:linear-gradient(180deg,rgba(255,255,255,.07),rgba(255,255,255,.02));padding:13px 0;letter-spacing:.34em;font-size:12.5px;color:#dfe7f2}
.fork{position:relative;height:46px;max-width:1010px;margin:0 auto}
.fork i{position:absolute;background:rgba(255,255,255,.26);display:block}
.fork .stem{left:50%;top:0;width:1px;height:18px}
.fork .bar{left:16.6%;right:16.6%;top:18px;height:1px}
.fork .d1{left:16.6%;top:18px;width:1px;height:28px}
.fork .d2{left:50%;top:18px;width:1px;height:28px}
.fork .d3{left:83.4%;top:18px;width:1px;height:28px}
.cols{display:grid;grid-template-columns:1fr 1fr 1fr;gap:26px;max-width:1010px;margin:0 auto}
.col{display:flex;flex-direction:column;gap:14px}
.cat{text-align:center;font-size:14px;letter-spacing:.2em;color:#eef4fb;border-bottom:1px solid var(--line);padding-bottom:10px;margin-bottom:4px;font-weight:600}
.cat span{display:block;font-size:10px;color:var(--dim);letter-spacing:.16em;margin-top:5px;font-weight:400}
.node{position:relative;display:block;text-decoration:none;color:inherit;border:1px solid rgba(255,255,255,.22);background:linear-gradient(180deg,rgba(255,255,255,.10),rgba(255,255,255,.04));padding:16px 17px 15px;border-radius:3px;overflow:hidden;transition:transform .38s cubic-bezier(.2,.8,.2,1),border-color .3s,box-shadow .38s,background .3s;flex:1}
.node::after{content:"";position:absolute;left:0;top:0;width:2px;height:0;background:var(--gold);transition:height .35s}
.node:hover{transform:translateY(-6px);border-color:rgba(216,178,106,.55);box-shadow:0 18px 44px rgba(0,0,0,.45),0 0 0 1px rgba(216,178,106,.12);background:linear-gradient(180deg,rgba(255,255,255,.13),rgba(255,255,255,.05))}
.node:hover::after{height:100%}
.node .tag{display:inline-block;font-size:10px;letter-spacing:.16em;color:var(--gold);border:1px solid rgba(216,178,106,.35);padding:3px 8px;border-radius:2px;margin-bottom:10px}
.node h4{font-family:"Songti SC",Georgia,serif;font-size:17.5px;font-weight:600;letter-spacing:.04em;margin-bottom:8px;color:#f2f7fd}
.node p{font-size:11.8px;line-height:1.75;color:#cfdbe8}
.node .db{display:block;margin-top:11px;font-size:10.5px;color:var(--blue);letter-spacing:.03em;line-height:1.7}
.node .db.none{color:#8b9db4;font-style:italic}
.node .arrow{position:absolute;right:15px;bottom:12px;color:var(--gold);opacity:0;transform:translateX(-6px);transition:.3s}
.node:hover .arrow{opacity:1;transform:translateX(0)}
.legend{margin:30px auto 0;max-width:1010px;text-align:center;border-top:1px solid var(--line2);padding-top:18px;font-size:11.5px;color:#7d90a8;letter-spacing:.08em}
.legend b{color:var(--gold);font-weight:500;letter-spacing:.04em}
.homesec{max-width:1180px;margin:56px auto 0}
.homesec h3{font-family:"Songti SC",Georgia,serif;font-size:21px;letter-spacing:.08em;margin-bottom:6px}
.homesec .sub{color:var(--dim);font-size:12px;margin-bottom:18px;line-height:1.8}
.scrollx{overflow-x:auto;border:1px solid var(--line);border-radius:3px;background:rgba(255,255,255,.03)}
.cmp{width:100%;border-collapse:collapse;font-size:12px;min-width:1120px}
.cmp th{background:rgba(255,255,255,.05);color:var(--muted);font-weight:600;font-size:11px;letter-spacing:.06em;padding:10px 10px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
.cmp td{padding:10px 10px;border-bottom:1px solid var(--line2);color:#c8d5e3;line-height:1.6;vertical-align:top}
.cmp tr:hover td{background:rgba(216,178,106,.05)}
.cmp td.src{white-space:nowrap}
.cmp td.src a{color:#f2f7fd;text-decoration:none;font-weight:600}
.cmp td.src a:hover{color:var(--gold)}
.cmp td.src small{display:block;color:var(--dim);font-weight:400;font-size:10.5px}
.cmp td.c{text-align:center}
.sy{color:var(--green);font-weight:700}.sp{color:var(--gold);font-weight:700}.sn{color:#5f7189}
.cmp td.c small{display:block;font-size:10px;color:var(--dim)}
.keyline{margin-top:12px;font-size:11.5px;color:var(--dim)}
.keyline span{margin-right:16px}
.hero2{padding:6px 0 20px;border-bottom:1px solid var(--line2);margin-bottom:8px;position:relative}
.hero2::after{content:"";position:absolute;left:0;bottom:-1px;width:88px;height:2px;background:var(--gold)}
.crumb{font-size:11.5px;color:var(--dim);letter-spacing:.12em;margin-bottom:16px}
.crumb b{color:var(--muted);font-weight:500}
.hero2 h2{font-family:"Songti SC",Georgia,serif;font-size:34px;font-weight:600;letter-spacing:.05em}
.hero2 .lead{margin-top:14px;color:#adc0d4;font-size:13px;line-height:1.95;max-width:900px}
.secnav{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;gap:26px;align-items:center;background:rgba(9,16,27,.9);backdrop-filter:blur(10px);border-bottom:1px solid var(--line2);padding:12px 0;margin:0 0 28px;font-size:12px;flex-wrap:wrap}
.secnav button{background:none;border:none;color:var(--muted);font:inherit;letter-spacing:.12em;cursor:pointer;padding:0;transition:.2s}
.secnav button:hover{color:var(--gold)}
.block{margin-bottom:56px;scroll-margin-top:64px}
.btitle{display:flex;align-items:baseline;gap:14px;margin-bottom:20px}
.btitle .no{font-family:Georgia,serif;color:var(--gold);font-size:13px;letter-spacing:.1em}
.btitle h3{font-family:"Songti SC",Georgia,serif;font-size:19px;font-weight:600;letter-spacing:.08em}
.btitle .sub{color:var(--dim);font-size:11.5px;letter-spacing:.06em}
.shotgrid{display:grid;grid-template-columns:1.18fr .82fr;gap:28px;align-items:start}
.shotcol{display:flex;flex-direction:column;gap:14px}
.shot{position:relative;border:1px solid var(--line);background:var(--panel2);padding:9px;border-radius:3px;transition:transform .42s cubic-bezier(.2,.8,.2,1),box-shadow .42s,border-color .3s;cursor:zoom-in}
.shot img{display:block;width:100%;border-radius:2px}
.shot:hover{transform:translateY(-8px) scale(1.012);border-color:rgba(216,178,106,.45);box-shadow:0 26px 60px rgba(0,0,0,.55)}
.datawide .shot+.shot{margin-top:12px}
.cap{margin-top:9px;font-size:11px;color:#93a7bd;line-height:1.75}
.card{border:1px solid var(--line);background:linear-gradient(180deg,rgba(255,255,255,.07),rgba(255,255,255,.025));border-radius:3px;padding:18px 20px;transition:transform .4s cubic-bezier(.2,.8,.2,1),border-color .3s,box-shadow .4s}
.card:hover{transform:translateY(-5px);border-color:rgba(216,178,106,.4);box-shadow:0 18px 44px rgba(0,0,0,.4)}
.card .row{display:grid;grid-template-columns:34px 1fr;gap:10px;padding:9px 0;border-bottom:1px solid var(--line2);font-size:12px;line-height:1.85;color:#c8d5e3}
.card .row:last-of-type{border-bottom:none}
.card .row .k{color:var(--gold);font-weight:700;font-size:11px;letter-spacing:.08em}
.chips{display:flex;flex-wrap:wrap;gap:7px;margin-top:14px}
.chip{font-size:10.5px;color:#a9bccf;border:1px solid rgba(255,255,255,.16);padding:4px 9px;border-radius:2px}
.stats{display:flex;gap:26px;padding:6px 0 16px;border-bottom:1px solid var(--line2);margin-bottom:14px;flex-wrap:wrap}
.stat .n{font-family:Georgia,serif;font-size:28px;color:#fff;line-height:1.1}
.stat .l{font-size:10.5px;color:var(--dim);letter-spacing:.1em;margin-top:7px}
.note{font-size:12px;line-height:1.95;color:#b6c6d8}
.docs{display:grid;grid-template-columns:1fr;gap:16px}
.doc{background:var(--paper);color:var(--paper-ink);border-radius:3px;padding:18px 22px 14px;box-shadow:0 14px 36px rgba(0,0,0,.4);font-size:11.5px;line-height:1.9;transition:transform .4s cubic-bezier(.2,.8,.2,1),box-shadow .4s;position:relative}
.doc:hover{transform:translateY(-7px);box-shadow:0 28px 60px rgba(0,0,0,.55)}
.doc .dhead{font-size:9.5px;letter-spacing:.18em;color:#8a7b5e;margin-bottom:8px;display:flex;justify-content:space-between}
.doc h5{font-family:"Songti SC",Georgia,serif;font-size:14px;margin-bottom:7px;line-height:1.5}
.doc p{color:#3a3a3a;font-size:11.5px;line-height:1.95;text-align:justify}
.doc .hl{background:linear-gradient(transparent 62%,rgba(216,178,106,.55) 62%)}
.pnote{font-size:12px;line-height:1.9;color:#9db0c6;border-left:2px solid rgba(216,178,106,.5);padding:2px 0 2px 12px;margin-bottom:16px}
.chartgrid{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:22px}
.chart{border:1px solid var(--line);background:var(--panel2);border-radius:3px;padding:8px;cursor:zoom-in;transition:transform .4s,border-color .3s,box-shadow .4s}
.chart:hover{transform:translateY(-6px);border-color:rgba(216,178,106,.4);box-shadow:0 20px 50px rgba(0,0,0,.45)}
.chart img{display:block;width:100%;border-radius:2px}
.facts{margin-top:18px;border:1px solid var(--line);border-radius:3px;background:rgba(255,255,255,.03);padding:16px 18px}
.facts h6{font-size:11.5px;color:var(--gold);letter-spacing:.14em;margin-bottom:10px;font-weight:700}
.facts .scrollx+h6{margin-top:20px}
.facts table{width:100%;border-collapse:collapse;font-size:12px}
.facts th{text-align:left;color:var(--dim);font-size:10.5px;letter-spacing:.1em;padding:6px 8px;border-bottom:1px solid var(--line)}
.facts td{padding:6px 8px;border-bottom:1px solid var(--line2);color:#c8d5e3;line-height:1.6}
.facts td.m{color:var(--blue);font-family:"SF Mono",Menlo,monospace;font-size:11px;white-space:nowrap}
.facts p{margin-top:10px;font-size:12px;color:#9db0c6;line-height:1.9}
.facts p b{color:#fff}
.lv{display:inline-block;font-size:10px;line-height:1.5;padding:1px 7px;margin-left:8px;border-radius:2px;color:var(--gold);background:rgba(216,178,106,.12);border:1px solid rgba(216,178,106,.38);letter-spacing:.06em;vertical-align:middle}
.lv.lvs{color:#8fc0e8;background:rgba(118,169,214,.12);border-color:rgba(118,169,214,.4)}
.lvlegend{font-size:11.5px;color:var(--dim);margin:-4px 0 14px;line-height:1.9}
.lvlegend b{color:var(--gold);font-weight:600}
.deep{margin-bottom:22px;border:1px solid rgba(216,178,106,.35);background:rgba(216,178,106,.05);border-radius:3px;padding:18px 22px}
.deep h6{font-size:12px;color:var(--gold);letter-spacing:.12em;margin-bottom:12px;font-weight:700}
.deep ol{margin-left:18px}
.deep li{font-size:12.5px;line-height:2;color:#c8d5e3;margin-bottom:6px}
.deep li b{color:#fff}
.deep code,.vt code,.ft code{font-family:"SF Mono",Menlo,monospace;font-size:11px;color:var(--blue)}
.dguide{font-size:12px;line-height:1.95;color:#b6c6d8;background:rgba(255,255,255,.035);border-left:2px solid rgba(216,178,106,.55);padding:10px 14px;margin-bottom:16px;border-radius:2px}
.dguide b{color:var(--gold)}
/* 数据表卡片：标签页 */
.ttabs{display:flex;gap:0;border-bottom:1px solid var(--line);margin:8px 0 18px;flex-wrap:wrap}
.ttab{background:none;border:none;border-bottom:2px solid transparent;color:var(--muted);font:inherit;font-size:12.5px;letter-spacing:.06em;padding:10px 16px;cursor:pointer;margin-bottom:-1px}
.ttab:hover{color:#fff}
.ttab.on{color:var(--gold);border-bottom-color:var(--gold)}
.tpanel{display:none}.tpanel.on{display:block;animation:fade .35s}
.tmeta{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:18px}
.tmeta div{border:1px solid var(--line2);background:rgba(255,255,255,.03);padding:10px 12px;border-radius:3px}
.tmeta b{display:block;font-size:10px;color:var(--dim);letter-spacing:.12em;font-weight:500;margin-bottom:5px}
.tmeta span{font-size:12.5px;color:#e6edf6;line-height:1.6}
.subh{font-size:13px;color:#fff;letter-spacing:.08em;margin:26px 0 10px;font-weight:600;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.subh small{color:var(--dim);font-weight:400;font-size:11px;letter-spacing:.04em}
/* 字段表 */
.ftools{display:flex;gap:10px;align-items:center;margin-bottom:10px;flex-wrap:wrap}
.ftools input[type=text]{background:rgba(255,255,255,.06);border:1px solid var(--line);color:#fff;padding:7px 10px;border-radius:2px;font:inherit;font-size:12px;width:220px}
.ftools label{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:5px;cursor:pointer}
.ftools .cnt{font-size:11px;color:var(--dim)}
.ft{width:100%;border-collapse:collapse;font-size:12px;min-width:900px}
.ft th{position:sticky;top:0;background:#152234;color:var(--muted);font-size:10.5px;letter-spacing:.08em;font-weight:600;text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);z-index:1}
.ft td{padding:8px 10px;border-bottom:1px solid var(--line2);vertical-align:top;line-height:1.65;color:#c8d5e3}
.ft tr.key td{background:rgba(216,178,106,.06)}
.ft tr.key td:first-child{box-shadow:inset 2px 0 0 var(--gold)}
.ft .fn{font-family:"SF Mono",Menlo,monospace;font-size:11px;color:var(--blue);word-break:break-all}
.ft .cn{display:block;color:#fff;font-weight:600;font-size:12px;margin-top:2px}
.ft .ds{font-size:11.5px;color:#aebdcd}
.ft .use{font-size:11.5px;color:#e8d3a8}
.fill{display:flex;align-items:center;gap:7px;white-space:nowrap}
.fill i{display:block;width:64px;height:6px;background:rgba(255,255,255,.1);border-radius:3px;overflow:hidden}
.fill i b{display:block;height:100%;background:var(--green)}
.fill i b.lo{background:var(--red)}.fill i b.md{background:var(--gold)}
.fill em{font-style:normal;font-family:"SF Mono",Menlo,monospace;font-size:11px}
.fill+small{display:block;font-size:10px;color:var(--dim);margin-top:2px}
.dv{display:flex;flex-wrap:wrap;gap:4px}
.dv span{font-size:10.5px;border:1px solid rgba(255,255,255,.14);padding:1px 6px;border-radius:2px;color:#cdd8e4;white-space:nowrap}
.dv span em{font-style:normal;color:var(--dim);margin-left:3px}
.ex{font-size:11px;color:#9fb2c6;font-family:"SF Mono",Menlo,monospace;word-break:break-all}
.nm{font-size:11px;color:#cdd8e4;font-family:"SF Mono",Menlo,monospace;white-space:nowrap}
.rz{position:absolute;top:0;right:-3px;width:7px;height:100%;cursor:col-resize;z-index:2}
.rz:hover,.rz.on{background:rgba(216,178,106,.45)}
th.rzh{position:relative}
/* 处理漏斗 */
.funnel{border:1px solid var(--line);border-radius:3px;padding:14px 16px;background:rgba(255,255,255,.03)}
.fs{display:grid;grid-template-columns:28px 230px 1fr 92px 82px;gap:10px;align-items:center;padding:7px 0;border-bottom:1px solid var(--line2);font-size:12px}
.fs:last-child{border-bottom:none}
.fs .i{font-family:Georgia,serif;color:var(--gold)}
.fs .lbl{color:#fff}
.fs .bar{height:10px;background:rgba(255,255,255,.07);border-radius:2px;overflow:hidden}
.fs .bar b{display:block;height:100%;background:linear-gradient(90deg,#6aa9d8,#8ec3ea)}
.fs .v{font-family:"SF Mono",Menlo,monospace;text-align:right;color:#fff}
.fs .d{font-family:"SF Mono",Menlo,monospace;text-align:right;color:var(--red);font-size:11px}
.fs .why{grid-column:2/-1;font-size:11px;color:var(--dim);margin-top:-3px}
.agg{display:flex;gap:22px;flex-wrap:wrap;margin-top:12px;font-size:12px;color:#b6c6d8}
.agg b{color:#fff;font-family:Georgia,serif;font-size:16px;margin-right:4px}
.warn{margin-top:14px;border:1px solid rgba(229,154,143,.35);background:rgba(229,154,143,.06);border-radius:3px;padding:12px 16px;font-size:12px;line-height:1.9;color:#e7c9c3}
.warn b{color:#fff}
/* 变量手册 */
.vgroup{margin-bottom:34px}
.vgroup h4{font-family:"Songti SC",Georgia,serif;font-size:17px;letter-spacing:.06em;margin-bottom:4px}
.vgroup .gsub{font-size:11.5px;color:var(--dim);margin-bottom:12px}
.vt{width:100%;border-collapse:collapse;font-size:12px;min-width:980px}
.vt th{background:#152234;color:var(--muted);font-size:10.5px;letter-spacing:.08em;font-weight:600;text-align:left;padding:8px 10px;border-bottom:1px solid var(--line)}
.vt td{padding:9px 10px;border-bottom:1px solid var(--line2);vertical-align:top;line-height:1.7;color:#c8d5e3}
.vt td:first-child{color:#fff;font-weight:600;white-space:nowrap}
.vt td.f{color:#e6edf6}
.vt td.w{color:#e8d3a8;font-size:11.5px}
.rules{counter-reset:r;display:grid;grid-template-columns:1fr 1fr;gap:12px 24px}
.rules div{counter-increment:r;border:1px solid var(--line2);background:rgba(255,255,255,.03);border-radius:3px;padding:12px 14px 12px 44px;position:relative;font-size:12px;line-height:1.85;color:#c8d5e3}
.rules div::before{content:counter(r,decimal-leading-zero);position:absolute;left:14px;top:12px;font-family:Georgia,serif;color:var(--gold)}
.rules b{color:#fff}
/* 文献 */
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:22px}
.toolbar .lbl{font-size:10px;color:var(--dim);letter-spacing:.16em;margin:4px 4px 0 0}
.fchip{font-size:10.5px;color:var(--muted);border:1px solid var(--line);padding:5px 11px;border-radius:2px;cursor:pointer;transition:.2s;letter-spacing:.04em;background:none;font-family:inherit}
.fchip:hover{border-color:rgba(216,178,106,.5);color:#fff}
.fchip.on{background:rgba(216,178,106,.16);border-color:var(--gold);color:var(--gold)}

/* ============ 文献 ============ */
const P={
li2020:{t:'产业政策与信贷资金配置效率',a:'李广子、刘力',v:'金融研究',y:'2020',lv:'贷款',sel:'未讨论披露选择性：手工摘录年报附注逐笔合约，只做跨年去重、剔金融业；稳健性改用“全部贷款数据”加总成企业层贷款比率与期限结构重做。',ab:'基于上市公司逐笔银行贷款合约数据，考察产业政策对信贷资金配置效率的影响。研究发现，当上市公司处于国家产业政策支持的行业时，公司所拥有的政企关系对银行贷款合约制定的积极作用会更大，全要素生产率对贷款合约制定的作用也更明显。',dd:'从 A 股年报附注手工整理 2008—2015 年 1,069 家公司、13,096 笔贷款合约，字段含银行、金额、利率、期限、信用增级措施。'},
li2025:{t:'银行公司治理如何影响信贷资金成本？',a:'李广子、陈文、谢作翰',v:'金融评论',y:'2025',lv:'贷款',sel:'正面讨论：承认企业会选择性少披露利率较高的合约，但论证选择发生在企业层、解释变量在银行层，二者正交故不校正；另用“只保留同年度向多家银行借款的企业”子样本、控制信用增级方式、并以同省同类银行治理均值作工具变量。',ab:'降低企业融资成本是提高金融服务实体经济效率的核心任务。本文从金融供给侧角度分析银行公司治理对企业信贷资金成本的影响：先构建考虑银行公司治理的贷款定价决策模型，再基于手工整理的逐笔贷款合约做检验。',dd:'从 A 股年报附注手工整理 2011—2021 年 1,206 家、8,712 笔；脚注称上市公司一般只披露“期末存量贷款中金额较大的合约”。'},
zhang2025:{t:'放松中小商业银行准入管制与上市企业贷款',a:'张烁珣、赵静艺',v:'统计研究',y:'2025',lv:'贷款',sel:'未讨论披露选择性：文中“选择性偏误”指银企贷款关系内生，用市场势力工具变量与协变量匹配处理；样本只交代剔除金融业与 ST。',ab:'基于银企关系稳定的视角，利用上市企业银行贷款数据，实证分析 2009 年放松中小商业银行分支机构市场准入政策对企业融资行为的影响。研究发现，长期来看政策实施后企业转换贷款银行的比例显著降低。',dd:'CSMAR 上市公司贷款明细 2001—2024，含贷款时间、发款机构、金额、期限、利率、贷款类型与担保方式；从“发款机构”中分离银行与分支机构，再匹配金融许可名单。'},
wang2026:{t:'绿色信贷贴息如何激励企业绿色信贷配置？',a:'王怀明、王思远',v:'会计研究',y:'2026',lv:'企业',sel:'未讨论公告门槛：绿色信贷由企业披露的贷款公告识别，未公告企业按 0 进公司—年面板（ln(1+金额) 使零值合法）；稳健性有异质性稳健 DID、时间与空间安慰剂、双重机器学习、排除其他政策。',ab:'基于上市公司贷款公告构建企业层面绿色信贷数据，采用双重差分考察绿色信贷贴息政策对企业绿色信贷配置的影响及微观机制。研究发现贴息政策显著提升了企业绿色信贷配置水平。',dd:'企业绿色信贷数据来自公司披露的贷款相关公告，与《绿色信贷统计表填报说明》比对识别绿色项目；城市层面数据来自《中国城市统计年鉴》。'},
lin2025:{t:'绿色信贷业务对企业漂绿行为的甄别效应研究',a:'林娴、洪祥骏',v:'统计研究',y:'2025',lv:'企业',sel:'未讨论公告披露选择性：因变量大量为 0，用 Tobit 与“仅获贷企业”子样本处理；PSM 缓解处理组选择偏误，同行业同年度均值作工具变量。',ab:'基于我国绿色信贷的政策背景，搜集整理 2008—2022 年 A 股上市公司绿色信贷信息，探究银行绿色信贷业务对企业漂绿行为是否具有甄别效应。',dd:'从公司公开披露的全部贷款公告中识别 257 个绿色信贷关键词，并与定期报告文本匹配；验证方式为随机抽一部分手工计算，未给准确率。'},
yu2025:{t:'排污许可监管、绿色金融创新与企业信贷融资',a:'俞中、佟孟华、赵江山',v:'世界经济',y:'2025',lv:'企业',ab:'从转型金融视角，以污染企业首次申领排污许可证为准自然实验，构建政府（排污许可监管）、银行（绿色金融创新）与企业（信贷融资）的联动框架。',dd:'主回归用报表口径的借款成本、期限与规模；机制部分用贷款公告与年报“双来源”交叉识别绿色信贷。'},
liu2026:{t:'机会主义观还是效率观：影子银行监管与企业杠杆操纵',a:'刘志远、郑晓慧、李霆威、陈晓辉',v:'会计研究',y:'2026',lv:'企业',sel:'未称“选择偏差”，但脚注承认公告覆盖局限（“数据更容易获得”“只能捕捉最主要的供给方”），并用“附注库手工＋巨潮公告补充”双源识别；稳健性含 PSM-DID、熵平衡 DID、剔除政策当年等。',ab:'现有研究普遍把杠杆操纵视为损害债权人利益的机会主义行为，忽略了效率观。本文以资管新规实施为外生冲击，考察影子银行监管对企业杠杆操纵行为及其动机的影响。',dd:'利用 CSMAR 财务报表附注库，手工整理 2013—2017 年 A 股年报附注中当年的借款性质，识别委托贷款、信托贷款、票据贴现；委托贷款公告来自巨潮资讯网。'},
pan2026:{t:'银行环境履责、贷后管理与企业绿色贷款“漂绿”',a:'潘敏、袁月、朱雨萱',v:'金融研究',y:'2026',lv:'企业×银行',sel:'未讨论公告披露选择性：样本由企业贷款公告匹配而来，只把“银行贷前筛选”当作选择偏误，按贷前漂绿程度 10%/20%/30% 分位剔除后重估。',ab:'绿色贷款“漂绿”可能导致信贷资源错配与无效金融供给。本文基于 2013—2022 年 27 家上市商业银行的绿色贷款数据，检验商业银行环境履责对企业绿色贷款漂绿行为的影响及机制。',dd:'贷款数据来自 CSMAR 与企业年报，按绿色产业目录关键词匹配贷款公告得到绿色贷款，最终 2,012 个“贷款银行—借款企业—年度”观测；绿色声誉与环境效益取自银行可持续发展/社会责任报告。'},
li2022:{t:'银行金融科技、信贷配置与企业短债长用',a:'李逸飞、李茂林、李静',v:'中国工业经济',y:'2022',lv:'企业',sel:'明确承认“企业披露的贷款信息也具备选择性”：先做优质/非优质企业的组间银行特征差异检验，再用倾向得分匹配与工具变量处理匹配内生性。',ab:'以投融资期限结构错配为主体的企业短债长用行为加剧了杠杆风险。利用银行金融科技专利与企业贷款数据，本文发现银行金融科技通过提升信息甄别能力显著缓解企业短债长用，并促进长期融资由抵押贷款向信用贷款转型。',dd:'CSMAR 上市公司贷款库 2010—2020 年 127,254 条，整理为“企业—年份—银行”；核心变量按银行资产加权到企业，银行控制变量按贷款规模加权；机制检验用逐笔记录算信用、抵押、长期贷款占比。'},
wu2019:{t:'风险投资、认证效应与中小企业银行贷款',a:'武龙',v:'经济管理',y:'2019',lv:'企业',ab:'基于信号理论，以新三板挂牌公司数据为样本，研究风险投资作为认证信号对被投中小企业银行贷款可获得性的影响。有风投参与的企业获得更多贷款、更低成本、更宽松的贷款条件。',dd:'新三板 2013—2017 年 10,486 家、24,866 个企业年（表 1 各变量 24,655），财务来自 Wind；“当年是否存在信用贷款”由人工翻阅年报得到，均值 0.188。'},
yu2025b:{t:'财政金融协同的实体经济促进效应',a:'余明桂、张萌萌、安剑锋',v:'经济研究',y:'2025',lv:'企业',ab:'以“政采贷”政策为冲击，考察政府采购合同融资对中小企业银行贷款的影响，并讨论信用创造机制。',dd:'样本 2013—2021 年新三板 9,825 家、67,070 个企业年；另爬取政府采购合同公告做处理组。'},
panhb2025:{t:'上市公司壳资源、挤出效应与中小企业银行贷款成本',a:'潘红波、周颖、石宇欣',v:'金融研究',y:'2025',lv:'企业',ab:'借助“不允许在创业板借壳上市”的准自然实验，检验上市公司壳资源对中小企业银行借款成本的影响，发现挤出效应使中小企业借款成本上升。',dd:'2009—2018 年新三板＋创业板，财务来自 Wind/CSMAR。'},
cao2025:{t:'政府白名单的信贷引导效应研究',a:'曹廷求、庞念伟',v:'金融研究',y:'2025',lv:'贷款',sel:'数据是省监管口径全部逐笔贷款，不存在只披露部分贷款的问题；其“样本自选择”指专精特新名单的申报评选，用 PSM-DID（1:2 最近邻）与 500 次安慰剂处理。',ab:'政府信息赋能是优化资源配置的重要手段。本文以 2021 年东部某省公布的省级“专精特新”中小企业名单为准自然实验，基于银行—企业配对数据考察政府白名单的信贷引导效应。',dd:'东部某省全部银行的企业逐笔贷款 2021.1—2022.3（月度），约 180 万个银企—月观测；原文说明贷款数据库中没有企业财务信息；用行业×地区×规模×时间固定效应控制需求。'},
jiang2025:{t:'资产价格与银行信贷配置',a:'姜可心、谭小芬、朱菲菲',v:'金融研究',y:'2025',lv:'贷款',sel:'数据是某股份制银行内部全量逐笔贷款，无披露选择问题；以“全国性系统性重要银行、覆盖 78% 城市 / 95% 贷款笔数 / 90.5% 信贷量”论证代表性，稳健性集中在房价工具变量与城市样本构成。',ab:'基于某股份制商业银行 2010—2021 年逐笔贷款数据，发现房价上升会显著提升银行对企业的信贷供给，且以房屋土地抵押的贷款增加更多，体现抵押品渠道。',dd:'某股份行全量对公贷款 204,742 笔，覆盖 56 个城市；字段含发放机构、借款客户、金额、利率、发放日、到期日、贷款类型、担保方式。'},
she2025:{t:'科技金融的信贷支持研究',a:'佘楷文、申宇、赵绍阳',v:'管理世界',y:'2025',lv:'贷款',sel:'数据是某省银行按季向监管报送的全量未清偿贷款，无披露问题；其“样本选择偏误”指优质科技企业主动选址到科技支行附近，用“只保留支行开业前成立的企业”“只保留冲击前后都存在的企业”处理。',ab:'构建科技金融体制是高水平科技自立自强的有力支撑。本文采用微观逐笔信贷数据，研究银行通过设立科技支行加强科技金融服务的机制与效果。',dd:'某省银行向监管报送的未清偿贷款 2007—2016 年、季度；以科技支行设立为冲击，看贷款利率浮动比例与首贷率。'},

zhong2025:{t:'商业银行采纳人工智能有助于优化企业绿色转型中的信贷支持吗？',a:'钟茜',v:'金融研究',y:'2025',lv:'企业×银行',sel:'直接用 CSMAR 上市公司逐笔贷款，仅剔除关键变量缺失，全文未提披露或样本选择；稳健性没有针对“只披露部分贷款”。',ab:'从银行利润最大化视角构建理论模型，结合 2013—2022 年上市公司逐笔贷款数据，考察商业银行采纳人工智能是否提升“识绿”能力、优化企业绿色转型中的信贷支持。结果发现银行 AI 采纳率提高后企业贷款利率浮动幅度下降、融资约束减少，且主要惠及绿色企业。',dd:'CSMAR 逐笔贷款 2013—2022 年 A 股；1,152 个“银行—企业—贷款利率”样本、43,427 个融资约束观测；银行 AI 采纳用银行年报“管理层讨论”词频。'},

 deep:`<h6>文献拆解：李广子、刘力（2020，《金融研究》）——年报附注逐笔合约怎么变成四个 Y</h6><ol>
<li><b>取数：</b>从 2008—2015 年 A 股年报附注的「短期借款」「1 年内到期的长期借款」「长期借款」科目中手工摘录逐笔合约，记录发放银行、金额、利率、期限、信用增级措施。</li>
<li><b>去重与筛选：</b>同一合约在同一年或不同年度年报中重复出现的，核对后只留一次；剔除金融业。得到 1,069 家公司、13,096 笔合约。</li>
<li><b>构造 Y：</b><code>Amount</code>＝贷款金额 / 当年平均总资产（期初期末均值）；<code>Spread</code>＝实际年利率 − 同档基准利率，基准按 ≤1 年、1—3 年、3—5 年、>5 年四档匹配；<code>Maturity</code>＝ln（起止日之间的年数）；<code>Enhancement</code>＝信用 0、一种增级措施 1、两种 2、三种及以上 3（保证、担保、抵押、质押）。</li>
<li><b>样本口径：</b>字段有值才进回归——金额与期限 13,096 笔，利差 11,448 笔（约 87% 写了利率），信用增级 7,892 笔（约 60%）。控制变量来自 Wind，按年度 1%/99% 缩尾。稳健性另用全部贷款余额/总资产、长期贷款占比。</li>
<li><b>与我们的关系：</b>来源和字段相同（附注逐笔合约）。新三板全量中利率只有 32% 有值、担保方式 95% 有值，所以担保结构能做，价格做不了。</li></ol>`,

 deep:[`<h6>文献拆解：张景静、胡金焱（2025，《世界经济》）——公告表怎么变成银企面板</h6><p class="note" style="margin:-6px 0 8px">数据：<span class="chip">CSMAR 上市公司向银行借款表（日）</span> <span class="chip">CNRDS</span> <span class="chip">巨潮资讯</span></p><ol>
<li><b>取数：</b>2013—2023 年 A 股。贷款信息取 CSMAR「上市公司向银行借款表」（日度）——<b>该表始于 2013 年</b>，这是样本起点定在 2013 的直接原因；银行专利来自知网专利分析库；环境信息粉饰用巨潮 CSR 报告 ＋ CSMAR 环境数据库 ＋ CNRDS ESG。</li>
<li><b>拆行与规范化：</b>企业同时向多家银行借款时<b>拆成多条</b> → 211,499 条；银行名称不规范，用 CSMAR/CNRDS 的银行基本信息<b>手工改成规范全称</b>；按「年份—企业—贷款银行全称」<b>加总</b>成「年份—企业—银行—贷款规模」。</li>
<li><b>清洗：</b>剔金融业、ST/*ST/PT、资产负债率大于 1、只有 1 个观测的企业、缺失值；连续变量 1% 缩尾 → <b>7,436 个公司—年</b>。</li>
<li><b>构造：</b>被解释变量是环境信息粉饰（CSR 报告与实质环境信息的落差）；贷款数据不当 Y，而是给企业匹配「它的贷款银行的金融科技」，按贷款规模加权到企业—年。一行是<b>公告里的一个贷款事件</b>，没有余额、没有利率。</li>
<li><b>与我们的关系：</b>这条路只能拿「关系」拿不到「价格」；它的<b>拆行 → 改全称 → 按企业×银行加总</b>三步可以照搬到我们的企业×银行设计。</li><li><b>原文出处：</b>《世界经济》2025 年第 12 期第 192 页「数据来源与样本构建」。<div class="chart" data-full="figs/证据/ev_zhangjj2025_data.png" style="max-width:520px;margin:12px 0"><img src="figs/证据/ev_zhangjj2025_data.png" alt="张景静、胡金焱 2025 第 192 页原文"></div></li></ol>`,`<h6>文献拆解：桂荷发、文杰、王红建（2025，《金融研究》）——99,444 条公告事件怎么变成企业×银行面板</h6><p class="note" style="margin:-6px 0 8px">数据：<span class="chip">CSMAR 上市公司向银行贷款日度数据</span> <span class="chip">巨潮资讯</span></p><ol>
<li><b>取数：</b>2009—2023 年 A 股非金融。银企借贷来自 CSMAR 日度借款数据，并用<b>巨潮资讯网手工补充</b>；银行是否实施薪酬延付，人工翻银行年报「董事、监事及高级管理人员薪酬政策及考评激励机制」识别（截至 2023 年 216 家）。</li>
<li><b>去重与筛选：</b>删金融业、资不抵债、ST/*ST/PT、主要变量缺失；再剔除借款信息不完整的（<b>银行名称缺失或表达不明、金额和期限缺失</b>）与非银行金融机构借款 → <b>99,444 条</b>。</li>
<li><b>构造：</b>把银行延付状态套到每条借款记录上，构成「年份—借款企业—贷款银行—是否延付」面板 → <b>84,499 个企业×银行×年</b>；<code>SDLA</code>＝短期负债/总负债 − 短期资产/总资产；控制企业×银行 FE 与年份 FE，企业层面聚类，1% 缩尾。</li>
<li><b>样本口径：</b>99,444 条是<b>一条公告拆一行</b>的事件记录（多为授信申请），没有余额、没有利率；84,499 是匹配后剩下的企业×银行年。</li>
<li><b>与我们的关系：</b>这是「用公告事件做企业×银行面板」的完整范本；<b>去重、补漏（巨潮）、金额和期限缺失就删</b>这三条清洗规则可以直接照搬。</li><li><b>原文出处：</b>《金融研究》2025 年第 9 期第 101 页「（一）数据来源与样本选择」。<div class="chart" data-full="figs/证据/ev_gui2025_data.png" style="max-width:520px;margin:12px 0"><img src="figs/证据/ev_gui2025_data.png" alt="桂荷发、文杰、王红建 2025 第 101 页原文"></div></li></ol>`,`<h6>文献拆解：王怀明、王思远（2026，《会计研究》）——从贷款公告到企业绿色信贷</h6><ol>
<li><b>筛公告：</b>取 2010—2022 年全部公告，按标题与类型筛出借款、授信、担保三类，排除“经营范围”“公司简介”模板段。</li>
<li><b>抽要素：</b>定位“贷款方／借款方／金额／期限／用途”句，取出银行、金额与用途或项目名称。</li>
<li><b>判绿色：</b>用途或项目名称对照原银监会《绿色信贷统计表填报说明》的六大类（节能环保、清洁生产、清洁能源、生态环境、基础设施绿色升级、绿色服务）做关键词匹配，命中记为绿色贷款。</li>
<li><b>汇总：</b>按企业—年加总；<code>Gloan</code>＝ln(绿色贷款金额)，无绿色贷款记 0；<code>Gloan_asset</code>＝金额/期末总资产。</li>
<li><b>样本：</b>38,178 个企业年，Gloan 均值 0.91——反推有绿贷的企业年约 8%—9%，12 年累计约 3,000 多个，平均每年约 300 个。难点在第 1 步：CSMAR 的资金投向 57.6% 只写“业务经营”，直接按关键词匹配会把经营范围里的环保字样误判为绿色贷款。</li><li><b>原文出处：</b>《会计研究》2026 年，第 166 页「（三）数据来源与处理」；原页截图如下。<div class="chart" data-full="figs/证据/ev_wang2026_data.png" style="max-width:520px;margin:12px 0"><img src="figs/证据/ev_wang2026_data.png" alt="王怀明、王思远 2026 第 166 页原文"></div></li></ol>`],

 media1:{imgs:[{img:'assets/n-2022.png',full:'assets/n-2022-full.png'},{img:'assets/n-2023.png',full:'assets/n-2023-full.png'},{img:'assets/n-2023-restricted.png',full:'assets/n-2023-restricted-full.png'}],cap:'维泰股份（831099），三张图：① 2022 年报第八节专章，逐笔列示贷款方式、提供方、规模、起止日与利率；② 2023 年报附注「19、短期借款」，只剩保证与信用两类汇总；③ 同一份 2023 年报的受限资产说明，仍能读到单笔贷款——国家开发银行新疆分行 3 亿元，2018-12-14 至 2031-12-14，余额 2.7 亿元，抵押 5 栋养老住宅与 2 栋商业用房。'},

 facts:`<h6>正文里能取到的</h6><div class="scrollx" style="border:none;background:none"><table style="min-width:640px"><thead><tr><th>正文章节</th><th>能取到什么</th><th>维泰股份（831099）的例子</th></tr></thead><tbody><tr><td>管理层讨论与分析：资产负债、现金流分析</td><td>短期借款、筹资现金流的变动和原因，一两句话</td><td>2023 年筹资活动现金流净额 −10.28 亿元，并说明原因</td></tr><tr><td>重大事件：提供担保事项</td><td><b>逐笔担保表</b>（被担保人、担保金额、担保余额、起止日、责任类型、是否为关联方），加一张分类汇总表</td><td>2023 年提供担保 9.60 亿元，余额 7.10 亿元；被担保人多为子公司，背后多是子公司的银行借款</td></tr><tr><td>重大事件：关联交易</td><td>关联方为公司借款提供的担保，给预计金额和实际发生额</td><td>控股股东为公司担保，2023 年预计 36.06 亿元、实际发生 18.49 亿元</td></tr><tr><td>重大事件：资产被查封、扣押、冻结或抵押、质押</td><td>受限资产表加一段说明，常写出抵押贷款的银行、合同金额、起止日、余额</td><td>国开行新疆分行 3 亿元贷款在正文第 23 页（上面第 ③ 张图）</td></tr><tr><td>行业信息：融资情况（部分行业才有）</td><td>一句话说明融资来源</td><td>“融资主要来源于流动资金贷款”</td></tr><tr><td><b>2022 年及以前</b>：第八节“银行及非银行金融机构间接融资发生情况”</td><td><b>逐笔贷款专章</b>：贷款方式、贷款方、规模、起止日、利率</td><td>上面第 ① 张图；2023 年起取消</td></tr><tr><td>股份变动与融资</td><td>股票发行、存续的债券（不是银行借款）</td><td>存续的公司债、中期票据</td></tr></tbody></table></div><h6>附注里能取到的</h6><div class="scrollx" style="border:none;background:none"><table style="min-width:640px"><thead><tr><th>附注科目</th><th>能取到什么</th></tr></thead><tbody><tr><td>短期借款、长期借款、一年内到期的非流动负债</td><td><b>担保方式分类汇总</b>，覆盖全部借款，是最可靠的一层；部分企业还自愿列出逐笔明细</td></tr><tr><td>关联方交易：关联担保</td><td>逐笔关联担保：担保方、金额、起止日、是否履行完毕</td></tr><tr><td>所有权受到限制的资产、或有事项、承诺事项</td><td>抵押质押物，与借款相关的担保和承诺</td></tr><tr><td>财务费用</td><td>利息支出，是 COD 的分子</td></tr></tbody></table></div><p><b>和我们的数据的关系：</b>担保分类汇总（CreditShare 等）只来自附注，正文里没有这一层。逐笔数据正文和附注都用了：33,180 笔中借款附注 57%；担保情况 22%、关联担保 9%、受限资产 1.5%，这三类在正文和附注里都有对应章节，出处统计没有区分正文还是附注。2022 年的逐笔信息主要在正文专章，2023 年起分散到附注和正文的重大事件里。核对样本：维泰股份 2023 年报（229 页，财务报表从第 48 页起）与 2025 年半年报，半年报的章节相同。</p></div><div class="facts"><h6>2022 与 2023 的披露规则变了</h6><p>2022 年报有强制专章，逐笔列示贷款方式、提供方、规模、存续期间与利率。2023 年起该章取消，贷款信息转入附注“短期借款”，只按担保方式列汇总数。<b>逐笔披露从强制变成自愿</b>：数据没有消失，而是散在借款附注、担保章节、关联担保、或有事项、受限资产五处，需要逐段找。</p>`,

   warn:'<b>为什么自建：</b>CSMAR 有按担保方式分类的借款统计表，但<b>覆盖不全</b>——它主要覆盖 A 股上市公司，新三板（挂牌公司）基本取不到，所以这一层从年报附注自己提。它相当于新三板版的“CSMAR 半年表”，覆盖企业的全部借款，担保结构的<b>水平</b>（如信用借款占比）用它来算；逐笔数据有选择性，只用于机制和企业×银行设计。',
   rule:`<h6>组合类与非借款行怎么处理</h6><table><thead><tr><th>附注里的行</th><th>原始层（企业年度面板.csv）</th><th>变量层（变量面板.csv）</th></tr></thead><tbody><tr><td>信用、保证、抵押、质押</td><td>各自一列</td><td>信用 → 借款_信用；保证 → 借款_保证；抵押、质押 → 借款_抵质押</td></tr><tr><td>组合（如“抵押及保证借款”“质押+保证”）</td><td>组合合计一列，另存“组合明细”原文与金额</td><td>含抵押或质押的组合 → 抵质押；其余组合（如“保证+信用”）→ 保证；明细缺失、拆不开的 → 其他</td></tr><tr><td>应计利息</td><td>单列</td><td>不计入担保分类合计</td></tr><tr><td>票据贴现、保理等“其他”</td><td>单列</td><td>计入“其他”，不进入三类占比</td></tr></tbody></table><p>因此 CreditShare＝借款_信用 / 担保分类合计，CollShare＝借款_抵质押 / 担保分类合计，GuarShare＝借款_保证 / 担保分类合计；“抵押+保证”这样的组合算作抵质押。组合写法有 20 多种（2025H1 421 份半年报中 125 家有组合金额，最常见的是抵押与保证组合），提取规则要能识别“、和及/+＋”等连接写法。如需不归并的口径，可只用不含组合的纯信用、纯保证、纯抵质押重算。</p>`},

 deep:`<h6>文献拆解：武龙（2019，《经济管理》）——新三板年报怎么变成贷款规模、成本、条件</h6><ol>
<li><b>样本：</b>新三板挂牌公司 2013—2017 年，10,486 家、24,866 个企业年；财务数据来自 Wind。</li>
<li><b>规模：</b><code>Bankloan</code>＝(短期借款＋长期借款) / 期初总资产（均值 0.161，中位数 0.125，最大 0.701）；拆成 <code>SBankloan</code>＝短期借款/期初总资产（0.146）、<code>LBankloan</code>＝长期借款/期初总资产（0.0133）；稳健性用 <code>Loan</code>＝ln(取得借款收到的现金)，即新增贷款（不扣还款）。</li>
<li><b>成本：</b><code>Bankcost</code>＝财务费用 / 银行借款（均值 0.0631，最小 −0.135：财务费用含利息收入，所以会出现负值）。</li>
<li><b>条件：</b><code>Creditloan</code>：人工翻阅年报，当年存在信用贷款取 1，否则 0（均值 0.188，即不到五分之一的企业有信用贷款）。</li>
<li><b>与我们的关系：</b>同一来源。我们把这个 0/1 做成了金额和占比：2022—2025 年有信用借款的企业年占 27.2%（全部企业年为分母），在有借款且分类可用的企业里从 36% 升到 54%；成本用利息费用而不是财务费用，口径更干净。</li></ol>`,
 papers:['wu2019','yu2025b','panhb2025']},

   warn:'<b>来源说明：</b>这套数据的“贷款分析指标”42 个字段与 CSMAR 银行财务库“贷款分析”包的字段同名同序，是 CSMAR 银行库的整理版本。正式使用时应以 CSMAR 原库为准，并在文中写 CSMAR。'}],
 deep:`<h6>文献拆解：李逸飞、李茂林、李静（2022，《中国工业经济》）——银行层面的变量怎么进入企业面板</h6><ol>
<li><b>银企关系：</b>CSMAR 上市公司贷款库 2010—2020 年 127,254 条，整理成“企业—年份—银行”，确定每家企业每年从哪些银行借了多少。</li>
<li><b>银行变量：</b>先在银行—年层面算好：金融科技（银行专利累计值占比）、银行资产负债率、规模（ln 总资产）、ROA、不良贷款率、成立时长。</li>
<li><b>加权到企业：</b>核心变量 <code>bankfin</code> 按各银行资产规模加权平均到企业；银行控制变量按企业在各银行的贷款规模加权。稳健性改为按贷款规模加权核心变量。</li>
<li><b>Y：</b>企业短债长用 <code>LS</code> 来自报表（均值 0.155）；机制检验用逐笔贷款算信用、抵押、长期贷款占比。</li>
<li><b>要点：</b>银行年报数据本身只到银行—年；要和企业连起来，必须先有银企关系（CSMAR 逐笔、我们的企业×银行表或银行内部数据），漏报的贷款会让权重有误差。</li></ol>`,
 papers:['li2022','zhong2025','pan2026','song2026']},

function makeResizable(root){
  root.querySelectorAll('table.cmp,table.ft,table.vt').forEach(tb=>{
    tb.querySelectorAll('thead th').forEach(th=>{
      if(th.querySelector('.rz'))return;
      if(getComputedStyle(th).position==='static')th.classList.add('rzh');
      const h=document.createElement('span');h.className='rz';h.title='拖动调整列宽';th.appendChild(h);
      h.addEventListener('mousedown',e=>{e.preventDefault();e.stopPropagation();const x0=e.clientX,w0=th.getBoundingClientRect().width;h.classList.add('on');
        const mv=ev=>{const w=Math.max(48,w0+ev.clientX-x0);th.style.width=w+'px';th.style.minWidth=w+'px';};
        const up=()=>{h.classList.remove('on');document.removeEventListener('mousemove',mv);document.removeEventListener('mouseup',up);};
        document.addEventListener('mousemove',mv);document.addEventListener('mouseup',up);});
      h.addEventListener('dblclick',()=>{th.style.width='';th.style.minWidth='';});
    });
  });
}

  app.innerHTML=`<section class="view"><div class="hero2"><div class="crumb">总览 / <b>${s.crumb}</b></div><h2>${s.title}</h2><div class="lead">${s.lead}</div></div><div class="secnav"><button data-t="s1">① 来源</button><button data-t="s2">② 数据</button>${hasOv?'<button data-t="s3">③ 概述</button>':''}<button data-t="s4">${hasOv?'④':'③'} 文献</button></div><div class="block" id="s1"><div class="btitle"><span class="no">${s.no}.1</span><h3>原始数据来源</h3></div>${b1}${s.facts?`<div class="facts">${s.facts}</div>`:''}</div><div class="block" id="s2"><div class="btitle"><span class="no">${s.no}.2</span><h3>面板数据处理</h3></div>${b2}</div>${ovHTML}<div class="block" id="s4"><div class="btitle"><span class="no">${s.no}.${nW}</span><h3>相关顶刊文献</h3></div>${s.deep?(Array.isArray(s.deep)?s.deep.map(d=>`<div class="deep">${d}</div>`).join(''):`<div class="deep">${s.deep}</div>`):''}<div class="lvlegend">文献卡片右侧的标签是<b>样本层级</b>：<b>企业</b>＝企业—年面板，<b>贷款</b>＝逐笔合约（含银企—月/季），<b>企业×银行</b>＝企业—银行配对面板；银行只作解释变量或被匹配对象。带<b>披露</b>小标的文章用了逐笔/贷款层面数据，详情里写了它怎么处理自选择披露与稳健性。这 21 篇里只有 4 篇把披露选择性写进正文（李逸飞 2022、李广子等 2025、彭红枫 2026、张景静 2025），没有一篇拿逐笔数据核对报表借款余额来度量披露比例——这是我们的空间。</div><div id="toolbar"></div><div id="pgrid"></div></div></section>`;
  app.querySelectorAll('.shot,.chart').forEach(el=>el.addEventListener('click',()=>openLB(el.dataset.full)));
  app.querySelectorAll('.secnav button').forEach(b=>b.addEventListener('click',()=>document.getElementById(b.dataset.t).scrollIntoView({behavior:'smooth',block:'start'})));
  app.querySelectorAll('.ttab').forEach(b=>b.addEventListener('click',()=>{app.querySelectorAll('.ttab').forEach(x=>x.classList.toggle('on',x===b));app.querySelectorAll('.tpanel').forEach(p=>p.classList.toggle('on',p.dataset.panel===b.dataset.tab));makeResizable(app);}));
  bindFT(app);
  renderPapers(s);}
function renderPapers(s){const tb=document.getElementById('toolbar'),grid=document.getElementById('pgrid');
  if(!s.papers.length){tb.innerHTML='';grid.innerHTML=`<div class="empty">这一类还没有对应的顶刊研究。</div>`;return;}
  const js=[...new Set(s.papers.map(id=>P[id].v))];const ys=[...new Set(s.papers.map(id=>P[id].y))].sort().reverse();
  const note=s.papersNote?`<div class="pnote">${s.papersNote}</div>`:'';
  tb.innerHTML=note+`<div class="toolbar"><span class="lbl">期刊</span><button class="fchip on" data-t="j" data-v="">全部</button>${js.map(j=>`<button class="fchip" data-t="j" data-v="${j}">${j}</button>`).join('')}<span class="lbl" style="margin-left:18px">年份</span><button class="fchip on" data-t="y" data-v="">全部</button>${ys.map(y=>`<button class="fchip" data-t="y" data-v="${y}">${y}</button>`).join('')}</div>`;
  const draw=()=>{const list=s.papers.filter(id=>(!fs.j||P[id].v===fs.j)&&(!fs.y||P[id].y===fs.y));grid.innerHTML=`<div class="papers">${list.map(paperHTML).join('')}</div>`;grid.querySelectorAll('.paper').forEach(el=>el.addEventListener('click',()=>openPaper(el.dataset.id)));};
  tb.querySelectorAll('.fchip').forEach(b=>b.addEventListener('click',()=>{const t=b.dataset.t,v=b.dataset.v;fs[t]=v||null;tb.querySelectorAll(`.fchip[data-t="${t}"]`).forEach(x=>x.classList.toggle('on',x===b));draw();}));
  draw();}
let CUR=(location.hash||'').replace(/^#\/?/,'');
function go(h){CUR=h;try{history.replaceState(null,'',h?'#'+h:location.pathname+location.search);}catch(e){}route();}
function route(){const h=CUR;modal.classList.remove('on');lb.classList.remove('on');window.scrollTo({top:0});if(!h)renderHome();else if(h==='vars')renderVars();else renderDetail(h);makeResizable(app);}
window.addEventListener('hashchange',()=>{CUR=location.hash.replace(/^#\/?/,'');route();});
document.addEventListener('click',e=>{const a=e.target.closest('a[href^="#"]');if(!a)return;e.preventDefault();go(a.getAttribute('href').replace(/^#\/?/,''));});
route();
</script>
